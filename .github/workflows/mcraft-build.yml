name: Build Mcraft Web Client

on:
  workflow_dispatch:
  schedule:
    # Poll the upstream releases once per day. The build job runs only for a new tag.
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: mcraft-web-client-build
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - name: Checkout Central Macatuba repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check latest upstream release against versao.txt
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zardoy/minecraft-web-client/releases/latest)"
          tag="$(printf '%s' "$release_json" | jq -er 'select(.draft == false and .prerelease == false) | .tag_name')"
          test -n "$tag"

          current=""
          if [ -f minecraft/mcraft/versao.txt ]; then
            current="$(tr -d '\r\n' < minecraft/mcraft/versao.txt)"
          fi

          echo "Upstream latest release: $tag"
          echo "Currently published version: ${current:-<not set>}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$tag" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new release; skipping the build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A new release was detected; the build will run."
          fi

  build-and-publish:
    needs: check-release
    if: needs.check-release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Central Macatuba repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Clone the exact upstream release
        env:
          UPSTREAM_REF: ${{ needs.check-release.outputs.tag }}
        run: |
          git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/zardoy/minecraft-web-client.git upstream
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install upstream dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Apply Central Macatuba configuration
        run: |
          test -s minecraft/mcraft/config.json
          node -e "JSON.parse(require('fs').readFileSync('minecraft/mcraft/config.json', 'utf8'))"
          cp minecraft/mcraft/config.json upstream/config.json

      - name: Validate config.json against appConfig.ts
        working-directory: upstream
        run: |
          cat > src/__cm_config_check.ts <<'EOF'
          import configJson from '../config.json'
          import type { AppConfig } from './appConfig'

          const checkedConfig: AppConfig = configJson
          void checkedConfig
          EOF

          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const config = JSON.parse(fs.readFileSync('config.json', 'utf8'))
          const errors = []
          if (config.version !== undefined && typeof config.version !== 'number') {
            errors.push('"version" must be a number')
          }
          for (const key of ['defaultProxy', 'mapsProvider', 'skinTexturesProxy', 'p2pRelayServer', 'p2pRelayServerFallback', 'rightSideText', 'splashText', 'splashTextFallback', 'defaultUsername', 'defaultLanguage']) {
            if (config[key] !== undefined && typeof config[key] !== 'string') errors.push('"'+key+'" must be a string')
          }
          for (const key of ['defaultProxies', 'supportedLanguages', 'disabledCommands']) {
            if (config[key] !== undefined && (!Array.isArray(config[key]) || !config[key].every(v => typeof v === 'string'))) errors.push('"'+key+'" must be an array of strings')
          }
          for (const key of ['p2pRelayServer', 'p2pRelayServerFallback']) {
            if (config[key] !== undefined && !/^wss:\/\//i.test(config[key])) errors.push('"'+key+'" must use wss://')
          }
          if (config.promoteServers !== undefined) {
            if (!Array.isArray(config.promoteServers)) errors.push('"promoteServers" must be an array')
            else config.promoteServers.forEach((server, i) => {
              if (!server || typeof server !== 'object' || typeof server.ip !== 'string' || !server.ip.trim()) errors.push('"promoteServers['+i+'].ip" must be a non-empty string')
              for (const key of ['description', 'name', 'version']) {
                if (server?.[key] !== undefined && typeof server[key] !== 'string') errors.push('"promoteServers['+i+'].'+key+'" must be a string')
              }
            })
          }
          if (config.p2pTurnServers !== undefined) {
            if (!Array.isArray(config.p2pTurnServers)) errors.push('"p2pTurnServers" must be an array')
            else config.p2pTurnServers.forEach((server, i) => {
              if (!server || typeof server !== 'object' || !(typeof server.urls === 'string' || (Array.isArray(server.urls) && server.urls.every(v => typeof v === 'string')))) errors.push('"p2pTurnServers['+i+'].urls" must be a string or array of strings')
              for (const key of ['username', 'credential']) if (server?.[key] !== undefined && typeof server[key] !== 'string') errors.push('"p2pTurnServers['+i+'].'+key+' must be a string')
            })
          }
          if (errors.length) {
            console.error('Invalid config.json:\n- ' + errors.join('\n- '))
            process.exit(1)
          }
          console.log('config.json passed JSON and runtime shape validation.')
          EOF

          pnpm exec tsc --noEmit --resolveJsonModule
          rm src/__cm_config_check.ts

      - name: Prepare project and build production client
        working-directory: upstream
        env:
          CONFIG_JSON_SOURCE: REMOTE
          DISABLE_SERVICE_WORKER: "false"
        run: |
          pnpm prepare-project
          pnpm build
          test -s dist/index.html
          test -s dist/config.json
          node -e "JSON.parse(require('fs').readFileSync('dist/config.json', 'utf8'))"

      - name: Publish generated web client into minecraft/mcraft/game
        run: |
          mkdir -p minecraft/mcraft/game
          rsync -a --delete upstream/dist/ minecraft/mcraft/game/
          test -s minecraft/mcraft/game/index.html
          test -s minecraft/mcraft/game/config.json
          node -e "JSON.parse(require('fs').readFileSync('minecraft/mcraft/game/config.json', 'utf8'))"

      - name: Update version marker and commit all generated files together
        env:
          UPSTREAM_TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$UPSTREAM_TAG" > minecraft/mcraft/versao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft/mcraft/game/ minecraft/mcraft/versao.txt

          if git diff --cached --quiet; then
            echo "Generated files and version marker are unchanged; no commit needed."
            exit 0
          fi

          git commit -m "build(mcraft): publish upstream release $UPSTREAM_TAG"
          git push origin HEAD:main
