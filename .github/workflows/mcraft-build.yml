name: Build Mcraft Web Client

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Apenas validar config.json, sem build, publicação ou commit"
        required: false
        type: boolean
        default: false
      upstream_ref:
        description: "Release/tag, SHA completo de commit ou nome de branch do upstream (vazio = última release estável)"
        required: false
        type: string
        default: ""
      force_build:
        description: "Forçar build e publicação, mesmo que a versão já esteja publicada"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: mcraft-web-client-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VALIDATE_ONLY: ${{ inputs.validate_only || false }}
      FORCE_BUILD: ${{ inputs.force_build || false }}
      REQUESTED_UPSTREAM_REF: ${{ inputs.upstream_ref || '' }}

    steps:
      - name: Checkout Central Macatuba repository
        uses: actions/checkout@v4
        with:
          ref: principal
          fetch-depth: 0

      - name: Validate manual execution options
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "$VALIDATE_ONLY" = "true" ] && [ "$FORCE_BUILD" = "true" ]; then
            echo "::error::validate_only and force_build cannot be enabled together."
            exit 1
          fi

      - name: Resolve exact upstream release, branch or commit
        id: upstream
        run: |
          set -euo pipefail
          repository="zardoy/minecraft-web-client"
          requested="$REQUESTED_UPSTREAM_REF"
          ref_kind=""

          if [ -z "$requested" ]; then
            release_json="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repository/releases/latest")"
            upstream_ref="$(printf '%s' "$release_json" | jq -er '
              select(.draft == false and .prerelease == false) | .tag_name
            ')"
            ref_kind="release"
          elif [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            upstream_ref="$requested"
            ref_kind="commit"
          else
            if git ls-remote --exit-code "https://github.com/$repository.git" "refs/heads/$requested" >/tmp/cm-branch-ref.txt 2>/dev/null; then
              branch_found=true
            else
              branch_found=false
            fi
            if git ls-remote --exit-code "https://github.com/$repository.git" "refs/tags/$requested" "refs/tags/$requested^{}" >/tmp/cm-tag-ref.txt 2>/dev/null; then
              tag_found=true
            else
              tag_found=false
            fi

            if [ "$branch_found" = true ] && [ "$tag_found" = true ]; then
              echo "::error::The ref '$requested' exists as both a branch and a tag. Use an unambiguous ref."
              exit 1
            elif [ "$branch_found" = true ]; then
              upstream_ref="$requested"
              ref_kind="branch"
            elif [ "$tag_found" = true ]; then
              upstream_ref="$requested"
              ref_kind="tag"
            elif [[ "$requested" =~ ^[0-9]+(\\.[0-9A-Za-z-]+)+$ ]] && git ls-remote --exit-code "https://github.com/$repository.git" "refs/tags/v$requested" "refs/tags/v$requested^{}" >/dev/null 2>&1; then
              upstream_ref="v$requested"
              ref_kind="tag"
            else
              echo "::error::Upstream ref '$requested' was not found as a branch or tag."
              exit 1
            fi
          fi

          git init upstream
          git -C upstream remote add origin "https://github.com/$repository.git"
          git -C upstream fetch --depth=1 origin "$upstream_ref"
          git -C upstream checkout --detach FETCH_HEAD
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            requested_lower="$(printf '%s' "$requested" | tr '[:upper:]' '[:lower:]')"
            if [ "$upstream_sha" != "$requested_lower" ]; then
              echo "::error::Fetched commit does not match the requested SHA."
              exit 1
            fi
          fi

          echo "Resolved upstream $ref_kind: $upstream_ref"
          echo "Resolved upstream commit: $upstream_sha"
          echo "UPSTREAM_REF=$upstream_ref" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$upstream_sha" >> "$GITHUB_ENV"
          echo "UPSTREAM_REF_KIND=$ref_kind" >> "$GITHUB_ENV"

      - name: Compare upstream release with published version
        id: compare
        if: env.VALIDATE_ONLY != 'true' && env.FORCE_BUILD != 'true' && env.UPSTREAM_REF_KIND == 'release'
        run: |
          set -euo pipefail
          current="$(cat minecraft/mcraft/versao.txt 2>/dev/null | tr -d '\r\n[:space:]' || true)"
          echo "Upstream release: $UPSTREAM_REF"
          echo "Currently published version: $current"
          if [ "$UPSTREAM_REF" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new release; skipping the build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A new release was detected."
          fi

      - name: Set up Node.js
        if: env.VALIDATE_ONLY == 'true' || env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned pnpm
        if: env.VALIDATE_ONLY == 'true' || env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release'
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install upstream dependencies
        if: env.VALIDATE_ONLY == 'true' || env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release'
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Apply Central Macatuba configuration
        if: env.VALIDATE_ONLY == 'true' || env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release'
        run: |
          set -euo pipefail
          test -s minecraft/mcraft/config.json
          node -e "JSON.parse(require('fs').readFileSync('minecraft/mcraft/config.json', 'utf8'))"
          cp minecraft/mcraft/config.json upstream/config.json

      - name: Validate config.json against the resolved AppConfig type
        if: env.VALIDATE_ONLY == 'true' || env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release'
        working-directory: upstream
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const config = JSON.parse(fs.readFileSync('config.json', 'utf8'))
          if (!config || typeof config !== 'object' || Array.isArray(config)) {
            throw new TypeError('config.json must contain a JSON object')
          }
          if (config.version !== undefined && (!Number.isInteger(config.version) || config.version < 1)) {
            throw new TypeError('"version" metadata must be a positive integer')
          }
          if (config.defaultHost !== undefined && typeof config.defaultHost !== 'string') {
            throw new TypeError('"defaultHost" metadata must be a string')
          }
          EOF

          cat > src/__cm_config_check.ts <<'EOF'
          import configJson from '../config.json'
          import type { AppConfig } from './appConfig'

          type DeepExact<Actual, Expected> =
            Actual extends readonly (infer ActualItem)[]
              ? Expected extends readonly (infer ExpectedItem)[]
                ? DeepExact<ActualItem, ExpectedItem>[]
                : never
              : Actual extends object
                ? Expected extends object
                  ? Exclude<keyof Actual, keyof Expected> extends never
                    ? { [Key in keyof Actual]: Key extends keyof Expected ? DeepExact<Actual[Key], Expected[Key]> : never }
                    : never
                  : never
                : Actual extends Expected
                  ? Actual
                  : never

          const { version: _version, defaultHost: _defaultHost, ...appConfig } = configJson
          const checkedConfig: DeepExact<typeof appConfig, AppConfig> = appConfig
          void checkedConfig
          EOF

          trap 'rm -f src/__cm_config_check.ts' EXIT
          pnpm prepare-project
          pnpm exec tsc --noEmit --resolveJsonModule
          echo "config.json passed JSON, metadata and exact AppConfig type validation."

      - name: Stop after config validation
        if: env.VALIDATE_ONLY == 'true'
        run: echo "Validation-only mode completed. Build, publication and commit were skipped."

      - name: Build production client
        if: env.VALIDATE_ONLY != 'true' && (env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release')
        working-directory: upstream
        env:
          CONFIG_JSON_SOURCE: REMOTE
          DISABLE_SERVICE_WORKER: "false"
        run: |
          set -euo pipefail
          pnpm build
          test -s dist/index.html
          test -s dist/config.json
          node -e "JSON.parse(require('fs').readFileSync('dist/config.json', 'utf8'))"

      - name: Publish generated web client into minecraft/mcraft/game
        if: env.VALIDATE_ONLY != 'true' && (env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release')
        run: |
          set -euo pipefail
          mkdir -p minecraft/mcraft/game
          rsync -a --delete upstream/dist/ minecraft/mcraft/game/
          test -s minecraft/mcraft/game/index.html
          test -s minecraft/mcraft/game/config.json
          node -e "JSON.parse(require('fs').readFileSync('minecraft/mcraft/game/config.json', 'utf8'))"

      - name: Update version marker and commit all generated files together
        if: env.VALIDATE_ONLY != 'true' && (env.FORCE_BUILD == 'true' || steps.compare.outputs.changed == 'true' || env.UPSTREAM_REF_KIND != 'release')
        run: |
          set -euo pipefail
          printf '%s\n' "$UPSTREAM_REF" > minecraft/mcraft/versao.txt
          printf '%s\n' "$UPSTREAM_SHA" > minecraft/mcraft/game/source-commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft/mcraft/game/ minecraft/mcraft/versao.txt

          if git diff --cached --quiet; then
            echo "Generated files and version markers are unchanged; no commit needed."
            exit 0
          fi

          git commit -m "build(mcraft): publish upstream ref $UPSTREAM_REF"
          git push origin HEAD:principal
