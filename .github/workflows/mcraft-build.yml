name: Build Mcraft Web Client

on:
  workflow_dispatch:
  schedule:
    # Poll the upstream releases once per day. The build job runs only for a new tag.
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: mcraft-web-client-build
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - name: Check latest upstream release against versao.txt
        id: compare
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zardoy/minecraft-web-client/releases/latest)"
          tag="$(printf '%s' "$release_json" | jq -er 'select(.draft == false and .prerelease == false) | .tag_name')"
          test -n "$tag"

          current="$(curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/centralmacatuba/servicos-jogos/principal/minecraft/mcraft/versao.txt?cachebust=${GITHUB_RUN_ID}" \
            | tr -d '\r\n[:space:]')"

          echo "Upstream latest release: $tag"
          echo "Currently published version: ${current:-<not set>}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$tag" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new release; skipping the build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A new release was detected; the build will run."
          fi

  build-and-publish:
    needs: check-release
    if: needs.check-release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Central Macatuba repository
        uses: actions/checkout@v4
        with:
          ref: principal
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Clone the exact upstream release
        env:
          UPSTREAM_REF: ${{ needs.check-release.outputs.tag }}
        run: |
          git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/zardoy/minecraft-web-client.git upstream
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install upstream dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Apply Central Macatuba configuration
        run: |
          test -s minecraft/mcraft/config.json
          node -e "JSON.parse(require('fs').readFileSync('minecraft/mcraft/config.json', 'utf8'))"
          cp minecraft/mcraft/config.json upstream/config.json

      - name: Validate config.json against the release AppConfig type
        working-directory: upstream
        run: |
          # "version" and "defaultHost" are Central Macatuba metadata retained in
          # config.json for its own tooling. The remaining object must match the
          # exact AppConfig contract shipped in this upstream release.
          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const config = JSON.parse(fs.readFileSync('config.json', 'utf8'))
          if (!config || typeof config !== 'object' || Array.isArray(config)) {
            throw new TypeError('config.json must contain a JSON object')
          }
          if (config.version !== undefined && (!Number.isInteger(config.version) || config.version < 1)) {
            throw new TypeError('"version" metadata must be a positive integer')
          }
          if (config.defaultHost !== undefined && typeof config.defaultHost !== 'string') {
            throw new TypeError('"defaultHost" metadata must be a string')
          }
          EOF

          cat > src/__cm_config_check.ts <<'EOF'
          import configJson from '../config.json'
          import type { AppConfig } from './appConfig'

          // Recursively checks assignability and rejects keys that do not exist
          // in the upstream type, including keys nested inside typed objects.
          // Record<string, any> fields remain intentionally extensible as defined
          // by AppConfig itself.
          type DeepExact<Actual, Expected> =
            Actual extends readonly (infer ActualItem)[]
              ? Expected extends readonly (infer ExpectedItem)[]
                ? DeepExact<ActualItem, ExpectedItem>[]
                : never
              : Actual extends object
                ? Expected extends object
                  ? Exclude<keyof Actual, keyof Expected> extends never
                    ? { [Key in keyof Actual]: Key extends keyof Expected ? DeepExact<Actual[Key], Expected[Key]> : never }
                    : never
                  : never
                : Actual extends Expected
                  ? Actual
                  : never

          const { version: _version, defaultHost: _defaultHost, ...appConfig } = configJson
          const checkedConfig: DeepExact<typeof appConfig, AppConfig> = appConfig
          void checkedConfig
          EOF

          trap 'rm -f src/__cm_config_check.ts' EXIT
          pnpm prepare-project
          pnpm exec tsc --noEmit --resolveJsonModule

      - name: Build production client
        working-directory: upstream
        env:
          CONFIG_JSON_SOURCE: REMOTE
          DISABLE_SERVICE_WORKER: "false"
        run: |
          pnpm build
          test -s dist/index.html
          test -s dist/config.json
          node -e "JSON.parse(require('fs').readFileSync('dist/config.json', 'utf8'))"

      - name: Publish generated web client into minecraft/mcraft/game
        run: |
          mkdir -p minecraft/mcraft/game
          rsync -a --delete upstream/dist/ minecraft/mcraft/game/
          test -s minecraft/mcraft/game/index.html
          test -s minecraft/mcraft/game/config.json
          node -e "JSON.parse(require('fs').readFileSync('minecraft/mcraft/game/config.json', 'utf8'))"

      - name: Update version marker and commit all generated files together
        env:
          UPSTREAM_TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$UPSTREAM_TAG" > minecraft/mcraft/versao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft/mcraft/game/ minecraft/mcraft/versao.txt

          if git diff --cached --quiet; then
            echo "Generated files and version marker are unchanged; no commit needed."
            exit 0
          fi

          git commit -m "build(mcraft): publish upstream release $UPSTREAM_TAG"
          git push origin HEAD:principal
