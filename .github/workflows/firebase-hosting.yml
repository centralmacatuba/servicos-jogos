name: Deploy Firebase Hosting

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy all Firebase Hosting sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CENTRALMACATUBA }}'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy all Hosting targets
        run: firebase deploy --only hosting --project centralmacatuba --non-interactive
